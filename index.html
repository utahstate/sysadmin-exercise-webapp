<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysadmin Exercise</title>
</head>
<body>

    <h1>Syadmin Exercise</h1>

    <!-- The decoded content will appear here automatically -->
    <div id="content-container">Loading content...</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {

        fetch('content.txt')
            .then(response => {
                if (!response.ok) throw new Error('File not found');
                return response.text();
            })
            .then(base64String => {
                // 1. Remove the "data:text/html;base64," prefix if it exists
                let cleanString = base64String.replace(/^data:text\/html;base64,/, '');

                // 2. Strip ALL hidden spaces, newlines, and line breaks anywhere in the string
                cleanString = cleanString.replace(/[\s\n\r]/g, '');

                // 3. Decode the safely cleaned string
                const decodedHTML = window.atob(cleanString);

                // 4. Inject into your container
                document.getElementById('content-container').innerHTML = decodedHTML;
            })
            .catch(error => {
                console.error('Error auto-loading file:', error);
                document.getElementById('content-container').innerHTML = 'Failed to load content.';
            });
    });
</script>


</body>
</html>
